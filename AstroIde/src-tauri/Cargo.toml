[package]
name = "astro-editor"
version = "0.1.0"
description = "Astro Code Editor - A fast code editor built with Tauri"
authors = ["Jeshua"]
edition = "2021"

[lib]
name = "astro_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
window-vibrancy = "0.6"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
urlencoding = "2"

[profile.release]
opt-level = "z"        # Máxima optimización para tamaño mínimo
lto = true             # Link-Time Optimization completo
codegen-units = 1      # 1 thread = mejor optimización global
strip = "symbols"      # Quitar todos los símbolos
panic = "abort"        # Sin unwind = menos código

[profile.release.build-override]
opt-level = "z"

[profile.dev]
opt-level = 0
incremental = true     # Compilación incremental en dev (más rápido)
